name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The lab runner (app01) takes one job at a time and has no Actions cache: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: [self-hosted, cds2apds]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python tools/validate_examples.py

  python:
    runs-on: [self-hosted, cds2apds]
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: services/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-fail-under=80

  typescript:
    runs-on: [self-hosted, cds2apds]
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: services/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
